<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!--Nav-->
    <nav class="navbar navbar-expand-lg navbar-light bg-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/Bootstrap-JS-Project/html/index.html">
                <img class="img-fluid rounded-circle" src="#" alt="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!--Navigation tabs-->
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link" href="/Bootstrap-JS-Project/html/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Bootstrap-JS-Project/html/about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Bootstrap-JS-Project/html/projects.html">Projects</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--Main-->
    <!--Form-->
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h1>Need Help?</h1>
        </div>
        <h2 class="text text-center">Contact Form</h2>
        <form class="border p-4 shadow-md bg-light">
            <div class="row">
                <div class="mb-3 col-md-6">
                    <input type="text" id=firstname class="form-control" placeholder="First Name" required>
                </div>
                <div class="mb-3 col-md-6">
                    <input type="text" class="form-control" placeholder="Last Name" required>
                </div>
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <textarea class="form-control" placeholder="Message" rows="4" col="30" required></textarea>
            </div>
            <div class="d-flex justify-content-center gap-3 mb-3">
                <button type="submit" class="btn btn-secondary">Submit</button>
            </div>
        </form>
    </div>
    <!--JS Script-->
    <script src="/js/script.js"></script>
</body>
</html>
